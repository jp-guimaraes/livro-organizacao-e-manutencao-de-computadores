site_name: Organização, Montagem e Manutenção de Computadores
site_description: >-
  Livro didático em duas partes para o curso técnico de informática do IFRN —
  Organização e Montagem de Computadores, e Manutenção de Computadores.
site_url: https://jp-guimaraes.github.io/livro-organizacao-e-manutencao-de-computadores/

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Início: index.md
  - Livro 1 — Organização e Montagem:
      - Apresentação: info2m/index.md
      - "1. Fundamentos: o que é um computador": info2m/01_fundamentos_o_que_e_um_computador.md
      - "2. Memória": info2m/02_memoria.md
      - "3. Sistema Operacional, Sistemas de Arquivo e Instalação": info2m/03_sistema_operacional_instalacao.md
      - "4. Hardware Físico e Montagem": info2m/04_hardware_fisico_montagem.md
      - "5. Arquitetura e Organização de Processadores": info2m/05_arquitetura_organizacao_processadores.md
  - Livro 2 — Manutenção de Computadores:
      - Apresentação: info3m/index.md
      - "1. Fundamentos e Abstração": info3m/01_fundamentos_e_abstracao.md
      - "2. Eletricidade e Fonte de Alimentação": info3m/02_eletricidade_fonte.md
      - "3. Processador, Benchmark e Dimensionamento": info3m/03_processador_benchmark_dimensionamento.md
      - "4. Suporte e Gestão de Serviços": info3m/04_suporte_gestao_servicos.md
